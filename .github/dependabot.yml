version: 2
updates:
  # The site itself has no dependencies — no package.json, no lockfile, nothing to update.
  # GitHub Actions are the only third-party code in the repository, so they are all that
  # is left to watch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'Build(deps)'
