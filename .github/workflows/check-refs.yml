name: Check reference links

# Reference URLs rot over time (domains move, repos vanish). Run the liveness
# sweep weekly + on demand so dead links surface without blocking normal CI.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The audit itself uses Node built-ins only.
      - run: node tools/check-refs.mjs
      - run: node tools/check-taxonomy.mjs
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-availability
          path: |
            reports/reference-availability.json
            reports/taxonomy-status.json
