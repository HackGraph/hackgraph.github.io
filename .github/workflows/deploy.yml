name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No install step: the repo has no dependencies. Node's own test runner drives
      # the content lint, the adapter tests and the engine's two suites.
      - run: node --test
      # The reference pages are generated and committed, so they can drift from the
      # content. Regenerate and fail if anything moved.
      - run: node tools/gen-reference.mjs
      - run: git diff --exit-code -- reference.html reference sitemap.xml
             || (echo "::error::reference pages are stale - run: node tools/gen-reference.mjs" && exit 1)

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # There is nothing to build. The repository IS the site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
